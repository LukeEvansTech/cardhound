<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}cardhound{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">cardhound</a>
  <nav>
    {% set here = request.url.path %}
    <a href="/" {{ 'aria-current=page' if here == '/' or here.startswith('/deal') }}>Deals</a>
    <a href="/wants" {{ 'aria-current=page' if here.startswith('/wants') and here != '/wants/new' }}>Wants</a>
    <a href="/wants/new" {{ 'aria-current=page' if here == '/wants/new' }}>Add card</a>
    <a href="/ops" {{ 'aria-current=page' if here.startswith('/ops') or here.startswith('/run') }}>Runs</a>
  </nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer class="foot">cardhound {{ version }} · eBay.com US view, shipping to the Oregon address</footer>
</body>
</html>
